name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
      docker_app: ${{ steps.filter.outputs.docker_app }}
      docker_ingester: ${{ steps.filter.outputs.docker_ingester }}
      docker_claude_worker: ${{ steps.filter.outputs.docker_claude_worker }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            source:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'tsconfig.json'
              - 'biome.json'
            docker_app:
              - 'apps/app/**'
              - 'packages/**'
              - 'docker-compose.yml'
            docker_ingester:
              - 'apps/ingester/**'
              - 'packages/**'
              - 'docker-compose.yml'
            docker_claude_worker:
              - 'apps/claude-worker/**'
              - 'packages/**'
              - 'docker-compose.yml'
            e2e:
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'apps/app/src/client/**'

  lint:
    name: Lint & Format
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint

  typecheck:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck

  test:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  docker-build-app:
    name: Docker Build (app)
    needs: changes
    if: needs.changes.outputs.docker_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/app/Dockerfile
          push: false
          tags: feed-reader/app:ci

  docker-build-ingester:
    name: Docker Build (ingester)
    needs: changes
    if: needs.changes.outputs.docker_ingester == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ingester/Dockerfile
          push: false
          tags: feed-reader/ingester:ci

  docker-build-claude-worker:
    name: Docker Build (claude-worker)
    needs: changes
    if: needs.changes.outputs.docker_claude_worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/claude-worker/Dockerfile
          push: false
          tags: feed-reader/claude-worker:ci

  vrt:
    name: Visual Regression Test
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --reporter=html --pass-with-no-tests
        env:
          CI: true
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Post screenshots to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            const screenshotDir = 'test-results';
            if (!fs.existsSync(screenshotDir)) return;
            const files = fs.readdirSync(screenshotDir, { recursive: true })
              .filter(f => String(f).endsWith('.png'));
            if (files.length === 0) return;
            const body = `## VRT Screenshots\n${files.map(f => `- \`${f}\``).join('\n')}\n\n[Full report](../actions/runs/${{ github.run_id }})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
