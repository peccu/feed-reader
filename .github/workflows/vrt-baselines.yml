name: VRT Baselines

# Regenerate the Playwright visual-regression baselines on the same platform
# the CI VRT job runs on (linux), then commit them back to the branch.
#
# Run this manually (Actions -> "VRT Baselines" -> Run workflow) after a UI
# change. The regular CI "Visual Regression Test" job then compares against the
# committed baselines. Baselines are OS-specific, so they must be produced here
# rather than on a developer's machine.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vrt-baselines
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install
      - run: bunx playwright install --with-deps chromium

      - name: Update snapshots
        run: bunx playwright test --update-snapshots
        env:
          CI: true

      - name: Commit regenerated baselines
        run: |
          if [[ -z "$(git status --porcelain e2e)" ]]; then
            echo "No baseline changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e
          git commit -m "test: regenerate VRT baselines [skip ci]"
          git push
